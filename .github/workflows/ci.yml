name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_MODE: scripted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Check native saved-run storage
        env:
          REPLAY_BROWSER_HEADLESS: '1'
        run: node tests/replay/browser-check.mjs
      - name: Check operational UI fixtures
        if: hashFiles('tests/ui/browser-check.mjs') != ''
        shell: bash
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5174 --strictPort > /tmp/blackout-ui-vite.log 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:5174/src/ui/fixture.html > /dev/null
          node tests/ui/browser-check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/
            .local/ui-01/*.png
            .local/replay-01/browser-evidence.json
          if-no-files-found: ignore
          retention-days: 3
